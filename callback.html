<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập TikTok · Moi Lab</title>
<meta name="description" content="Moi Lab: bản tin đời sống ngắn gọn cho người trẻ Việt Nam.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Newsreader:opsz,wght@6..72,500&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="khung"><a class="logo" href="./">MOI LAB<b>.</b></a>
<nav><a href="privacy.html">Quyền riêng tư</a><a href="terms.html">Điều khoản</a></nav></div></header>
<main><div class="khung">
<span class="nhan hien">Đăng nhập TikTok</span>
<h1 class="hien" id="tieu-de">Đang đọc mã…</h1>
<p class="mo" id="huong-dan"></p>
<code class="ma" id="ma" hidden></code>
<button id="chep" hidden>Chép mã</button>
<script>document.documentElement.classList.add("js");
const q = new URLSearchParams(location.search), ma = q.get('code'), loi = q.get('error');
const $ = id => document.getElementById(id);
if (ma) {
  $('tieu-de').textContent = 'Đã nhận mã đăng nhập';
  $('huong-dan').textContent = 'Chép mã dưới đây gửi cho Claude (hoặc dán vào lệnh "node tiktok-dang.mjs ma <mã>"). Mã chỉ dùng được một lần và hết hạn sau vài phút.';
  $('ma').textContent = ma; $('ma').hidden = $('chep').hidden = false;
  $('chep').onclick = () => navigator.clipboard.writeText(ma).then(() => $('chep').textContent = 'Đã chép');
} else {
  $('tieu-de').textContent = loi ? 'Đăng nhập chưa thành công' : 'Không có mã đăng nhập';
  $('huong-dan').textContent = loi ? `TikTok báo: ${loi} ${q.get('error_description') || ''}` : 'Trang này chỉ dùng khi TikTok chuyển về sau bước đăng nhập.';
}
</script>
</div></main>
<footer><div class="khung">© 2026 Moi Lab · <a href="https://www.facebook.com/616102181595777">Fanpage Moi Lab</a> · <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms of Service</a></div></footer>
<script>document.documentElement.classList.add("js");
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('ro'); io.unobserve(e.target); } }), { threshold: .1 });
document.querySelectorAll('.hien').forEach((el, i) => { el.style.transitionDelay = (i % 6) * 80 + 'ms'; io.observe(el); });
</script>
</body>
</html>
